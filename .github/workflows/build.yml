name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # rust-toolchain.toml pins the MSVC toolchain for local Windows builds; CI uses plain stable.
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-universal
            os: macos-latest
          - name: linux-x64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          if [ "${{ runner.os }}" = "macOS" ]; then rustup target add x86_64-apple-darwin aarch64-apple-darwin --toolchain stable; fi

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev libgtk-3-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxrandr-dev libx11-dev libxkbcommon-dev libwayland-dev libdbus-1-dev libpipewire-0.3-dev \
            libegl1-mesa-dev libgbm-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      # bash stops at the first failing command; the Windows default (pwsh) only checks the last one.
      - name: Lint and test
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        run: cargo build --release

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          case "${{ runner.os }}" in
            Windows)
              cp target/release/takeshot.exe dist/Takeshot.exe
              (cd dist && 7z a ../takeshot-${{ matrix.name }}.zip Takeshot.exe)
              ;;
            macOS)
              APP=dist/Takeshot.app
              mkdir -p "$APP/Contents/MacOS"
              lipo -create -output "$APP/Contents/MacOS/takeshot" \
                target/aarch64-apple-darwin/release/takeshot target/x86_64-apple-darwin/release/takeshot
              sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
              codesign --force --deep -s - "$APP"
              (cd dist && ditto -c -k --keepParent Takeshot.app ../takeshot-${{ matrix.name }}.zip)
              ;;
            Linux)
              cp target/release/takeshot dist/takeshot
              tar -C dist -czf takeshot-${{ matrix.name }}.tar.gz takeshot
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: takeshot-${{ matrix.name }}
          path: takeshot-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
