[package]
name = "takeshot"
version = "0.1.0"
edition = "2024"
description = "Fast screenshot tool for Windows, macOS and Linux: capture with PrtSc, annotate with editable objects, add backgrounds and watermarks."
license = "AGPL-3.0-or-later"
authors = ["Takeflow Sistemas"]
repository = "https://github.com/takeflow-oficial/takeshot"
homepage = "https://web.takeflow.com.br"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
xcap = "0.9"
tiny-skia = "0.12"
ab_glyph = "0.2"
arboard = { version = "3.7", features = ["image-data"] }
rfd = "0.18"
global-hotkey = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
dirs = "7"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mouse_position = "0.1"
epaint_default_fonts = "0.37"
sys-locale = "0.3.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
icns = "0.5.0"
ico = "0.6.0"
resvg = "0.49.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
